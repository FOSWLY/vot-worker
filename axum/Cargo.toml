[package]
name = "vot-worker"
version = "1.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
lazy_static = "1.5.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
toml = "1.1.6+spec-1.1.0"
tower-http = { version = "0.7.1", features = ["cors"] }
dotenv = "0.15.0"
tracing = "0.1.44"
tracing-loki = "0.2.7"
tracing-subscriber = "0.3.23"
url = "2.5.8"
